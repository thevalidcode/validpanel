name: 🚀 Deploy to server on push

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build on VPS & sync dist only
    runs-on: ubuntu-latest

    steps:
      - name: 🧠 Build on VPS and deploy dist only
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 2022
          script: |
            REPO_DIR=~/core-platform/frontend-src
            DEPLOY_DIR=~/core-platform/frontend

            mkdir -p "$REPO_DIR"
            cd "$REPO_DIR"

            if [ -d .git ]; then
              git pull origin main
            else
              git clone git@github.com:thevalidcode/validpanel.git .
              git checkout main
            fi

            npm ci --omit=dev
            npm run build -- --mode production

            mkdir -p "$DEPLOY_DIR"
            cp -r dist/* "$DEPLOY_DIR"/
            echo "Deployment completed. 🎉"
